# GPU runner pool for the RTX 4090 x86_64 box (192.168.0.229).
#
# The image is prebuilt (docker build -t pyasc-ci-runner:latest .) so compose
# never has to build/pull at `up` time. Bring up (from this dir, .env present):
#   docker compose -f compose.gpu.yml up -d --scale runner=3
#
# Ephemeral vs persistent and the registration credential are controlled by
# .env (ACCESS_TOKEN=PAT + EPHEMERAL=true for fresh-per-job, or RUNNER_TOKEN=
# a registration token for a persistent runner). Labels: gpu (+ the default
# self-hosted,linux,x64).
#
# Docker-out-of-Docker: the host docker socket is shared and the runner _work
# dir is bind-mounted at an IDENTICAL host path (RUNNER_WORK_HOST==RUNNER_WORKDIR)
# so the jobs' `docker run -v "$(pwd)":/workspace` sibling mounts resolve on the
# host daemon. OLLAMA_CACHE_HOST is a shared model cache (pull is a hit after run 1).
services:
  runner:
    image: pyasc-ci-runner:latest
    env_file: .env
    environment:
      RUNNER_SCOPE: repo
      LABELS: gpu
      DISABLE_AUTO_UPDATE: "true"
      START_DOCKER_SERVICE: "false"
      RUNNER_WORKDIR: ${RUNNER_WORKDIR}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNNER_WORK_HOST}:${RUNNER_WORKDIR}
      - ${OLLAMA_CACHE_HOST}:/root/.ollama
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
