# GPU runner pool for the RTX 4090 x86_64 box (192.168.0.229).
#
# The image is prebuilt (docker build -t pyasc-ci-runner:latest .) so compose
# never has to build/pull at `up` time. Bring up (from this dir, .env present):
#   docker compose -f compose.gpu.yml up -d
#
# Three explicit services (NOT `--scale`), because each runner MUST have its own
# isolated, path-aligned work dir + Ollama cache. The earlier shared mount caused
# concurrent nightly matrix jobs to collide in _actions/_temp (`Directory not
# empty`, `tar: Error is not recoverable`). Now runner-N uses ${AR_BASE}/work-N
# and ${AR_BASE}/ollama-N, bind-mounted at the IDENTICAL host path so the jobs'
# `docker run -v "$(pwd)":/workspace` sibling mounts resolve on the host daemon
# (Docker-out-of-Docker path alignment).
#
# Ephemeral vs persistent + the registration credential live in .env
# (ACCESS_TOKEN=PAT + EPHEMERAL=true for fresh-per-job, or RUNNER_TOKEN=a
# registration token for a persistent runner). Labels: gpu (+ self-hosted,linux,x64).
x-gpu-runner: &gpu-runner
  image: pyasc-ci-runner:latest
  env_file: .env
  restart: always
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  runner-1:
    <<: *gpu-runner
    environment:
      RUNNER_SCOPE: repo
      LABELS: gpu
      DISABLE_AUTO_UPDATE: "true"
      START_DOCKER_SERVICE: "false"
      RUNNER_WORKDIR: ${AR_BASE}/work-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AR_BASE}/work-1:${AR_BASE}/work-1
      - ${AR_BASE}/ollama-1:/root/.ollama
  runner-2:
    <<: *gpu-runner
    environment:
      RUNNER_SCOPE: repo
      LABELS: gpu
      DISABLE_AUTO_UPDATE: "true"
      START_DOCKER_SERVICE: "false"
      RUNNER_WORKDIR: ${AR_BASE}/work-2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AR_BASE}/work-2:${AR_BASE}/work-2
      - ${AR_BASE}/ollama-2:/root/.ollama
  runner-3:
    <<: *gpu-runner
    environment:
      RUNNER_SCOPE: repo
      LABELS: gpu
      DISABLE_AUTO_UPDATE: "true"
      START_DOCKER_SERVICE: "false"
      RUNNER_WORKDIR: ${AR_BASE}/work-3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AR_BASE}/work-3:${AR_BASE}/work-3
      - ${AR_BASE}/ollama-3:/root/.ollama
