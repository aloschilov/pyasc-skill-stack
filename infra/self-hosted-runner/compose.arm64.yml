# arm64 runner for the MacBook via Docker Desktop's Linux/arm64 VM.
#
# Serves every CI job, which all target `[self-hosted, arm64]`. The jobs pull
# the simulator image pinned by digest in reference/images/ENV.json; nothing
# here builds images.
#
# ONE runner. The three-runner fan-out came from the nightly generative matrix,
# whose eight jobs serialized ~18h two-deep; that campaign is over and its
# workflows are archived. The current gates are a PR gate and a merge gate that
# run one at a time, so the extra runners would idle while still competing for
# the same Docker daemon and disk. Add runner2/runner3 back (own AR_BASE2,
# AR_BASE3) if a fan-out workload returns.
#
# The image is prebuilt and `docker load`-ed onto the Mac (Docker Desktop's
# keychain credstore blocks host-side pulls/builds over SSH), so compose only
# runs the container. Bring up, from this directory with .env present:
#   docker compose -f compose.arm64.yml up -d
#
# The work dir is bind-mounted at the IDENTICAL host path. That alignment is
# load-bearing, not cosmetic: CI runs sibling containers via the shared Docker
# socket with `docker run -v "$PWD":/workspace`, and the daemon resolves that
# path on the VM, not inside the runner. A mismatched path mounts an empty
# directory and the job fails with files that plainly exist. A Docker named
# volume would NOT align. ${AR_BASE} must therefore be a real, writable host
# directory under a Docker-Desktop file-shared root.
#
# CONFIGURED_ACTIONS_RUNNER_FILES_DIR and DISABLE_AUTOMATIC_DEREGISTRATION are
# deliberately absent: with EPHEMERAL=true the persist dir is not volume-mounted,
# so they leave stale credentials behind and the container crash-loops. Each
# restart re-registers from scratch using the ACCESS_TOKEN PAT.
services:
  runner:
    image: pyasc-ci-runner:latest
    env_file: .env
    environment:
      RUNNER_SCOPE: repo
      LABELS: arm64
      DISABLE_AUTO_UPDATE: "true"
      START_DOCKER_SERVICE: "false"
      RUNNER_WORKDIR: ${AR_BASE}/work
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AR_BASE}/work:${AR_BASE}/work
    restart: always
