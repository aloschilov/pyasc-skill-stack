name: Skills CLI install
on:
  pull_request:
    paths:
      - 'skills/**'
      - 'tests/tools/test-npx-install.sh'
      - '.github/workflows/skills-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencode-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash tests/tools/test-npx-install.sh
