name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    # Pure static/L1 checks need no CANN or self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - name: Repository static checks
        run: bash tests/ci-gate.sh --tier pr
      - name: CANNBench contract and acceptance tests
        run: python -m unittest discover -s tests/unit -p 'test_cannbench_*.py' -v
      - name: Validate complete official catalog snapshot
        run: python integrations/cannbench/ci/validate_catalog.py integrations/cannbench/catalogs/official-tasks-1.1.2-20261001
      - name: Build dashboard
        run: python tests/tools/generate_dashboard.py --output-dir _site
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: _site
