name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  # Pinned by digest, not by tag: a moving runtime silently invalidates every
  # result below it. Built, smoke-tested and published upstream by
  # compiler-team-ru/pyasc-images; this is the cann9.2.0-u22.04-py3.11
  # multi-arch manifest, so the same ref resolves on amd64 and arm64 runners.
  # The authoritative copy of this value is reference/images/ENV.json --
  # scripts/check-image-pin.sh fails the PR gate if the two disagree.
  PYASC_SIM_IMAGE: ghcr.io/compiler-team-ru/pyasc-sim@sha256:6256a47b167ba05b2b7b2280ab0460e1da42a188bcec2c643f6a985718fd4b67
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ==========================================================================
  # PR gate: L1 unit tests + static checks (no Docker, no CANN)
  # ==========================================================================
  pr-gate:
    # Native arm64 on the self-hosted Mac runner (label `arm64`). This gate is
    # pure static checks + L1 unit tests (no Docker, no CANN); CI now runs
    # entirely on the Mac runner with no x86 emulation. (Formerly GitHub-hosted
    # ubuntu-latest; before that the RTX 4090 `gpu` box, now retired.)
    runs-on: [self-hosted, arm64]
    # Explicit cap; overrides GitHub's implicit 6h (timeout-minutes: 360) default.
    # Static checks + L1 units are fast; this is pure hygiene.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run PR gate
        run: bash tests/ci-gate.sh --tier pr


  # ==========================================================================
  # Merge gate: compile-check the upstream AscTile target suite in Docker
  #
  # This is the correctness reference (see reference/README.md). Compile-only:
  # each module carries ~100 parametrised cases and the camodel is slow, so the
  # blocking gate verifies COMPILE and leaves full numerical execution to a
  # manual or nightly run.
  #
  # The Docker image is built, smoke-tested and published upstream by
  # compiler-team-ru/pyasc-images. This repo never builds it; CI only pulls
  # the pinned digest.
  # ==========================================================================
  merge-gate:
    runs-on: [self-hosted, arm64]
    timeout-minutes: 60
    needs: [pr-gate]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      # No ghcr.io login. The upstream packages allow anonymous pulls
      # (matrix.json records public_registry_check.anonymous_registry_access),
      # and GITHUB_TOKEN is scoped to this repository's owner, so it could not
      # read a package in the compiler-team-ru org anyway.
      #
      # A *stale* credential is worse than none: if the runner's docker config
      # still holds a ghcr.io login for an account without access to
      # compiler-team-ru, the daemon sends it and the registry answers "denied"
      # even though the package is public. Pull with an empty docker config so
      # the request is genuinely anonymous.
      - name: Pull pyasc-sim image
        run: |
          set -euo pipefail
          anon="$(mktemp -d)"
          echo '{}' > "$anon/config.json"
          DOCKER_CONFIG="$anon" docker pull "${{ env.PYASC_SIM_IMAGE }}"
          tests/tools/verify_pyasc_image.sh "${{ env.PYASC_SIM_IMAGE }}"

      # The upstream image ships neither torch nor pytest, and the target suite
      # needs both: every module imports torch at scope, and the suite is run
      # through pytest. That is by design -- matrix.json lists the image's full
      # dependency set and neither is in it, and pyasc-dev itself depends on
      # neither. So build one overlay directory and mount it read-only into
      # each per-module container, instead of installing 24 times.
      #
      # torch goes in with --no-deps plus exactly the packages the image lacks.
      # A plain install would drag in newer sympy and setuptools which, on
      # PYTHONPATH, shadow the versions the image was qualified with. numpy is
      # never installed here at all: pyasc-dev needs numpy<2 and the image
      # already carries 1.26.4.
      - name: Provision torch and pytest for the target suite
        run: |
          set -euo pipefail
          TORCH_SITE="${RUNNER_TEMP}/torch-site"
          echo "TORCH_SITE=$TORCH_SITE" >> "$GITHUB_ENV"
          if [ -d "$TORCH_SITE/torch" ]; then
            echo "reusing overlay at $TORCH_SITE"
            exit 0
          fi
          mkdir -p "$TORCH_SITE"
          docker run --rm -v "$TORCH_SITE":/torch-site \
            "${{ env.PYASC_SIM_IMAGE }}" \
            python3.11 -m pip install --no-cache-dir --target /torch-site --no-deps \
              --index-url https://download.pytorch.org/whl/cpu \
              --extra-index-url https://pypi.org/simple \
              torch filelock networkx jinja2 MarkupSafe fsspec
          docker run --rm -v "$TORCH_SITE":/torch-site \
            "${{ env.PYASC_SIM_IMAGE }}" \
            python3.11 -m pip install --no-cache-dir --target /torch-site pytest
          # Fail here, loudly, rather than 24 times inside the compile loop.
          docker run --rm -v "$TORCH_SITE":/torch-site:ro -e PYTHONPATH=/torch-site \
            "${{ env.PYASC_SIM_IMAGE }}" \
            python3.11 -c 'import torch, pytest, numpy, sympy; print("overlay OK: torch", torch.__version__, "| numpy", numpy.__version__)'

      - name: Compile-check the AscTile target suite
        run: |
          set -uo pipefail
          PLATFORM=Ascend950PR_9599
          IMAGE="${{ env.PYASC_SIM_IMAGE }}"
          FAILED=0; BLOCKED=0; ran=0
          # Container-leak guard: --rm only fires on a clean exit, which a hung
          # simulator never gives, so the trap is the actual guarantee.
          CTR_NAME="pyasc-target-${{ github.run_id }}"
          trap 'docker rm -f "$CTR_NAME" 2>/dev/null || true' EXIT INT TERM
          # Recursive: upstream groups some cases into subpackages (matmul_v3/,
          # kimi_k3/) and moves them in and out between versions. A flat glob
          # would silently stop covering a whole group the day it moves.
          while IFS= read -r t; do
            [ -f "$t" ] || continue
            rel="${t#reference/asctile/target/}"
            slug="$(echo "${rel%.py}" | tr '/' '-')"
            start=$(date +%s)
            docker run --rm --name "${CTR_NAME}-${slug}" \
              --ulimit nofile=65536:65536 \
              -v "$PWD":/workspace:ro -w /workspace \
              -v "${TORCH_SITE}":/torch-site:ro -e PYTHONPATH=/torch-site \
              "$IMAGE" \
              python3.11 tests/tools/run_target_test.py "$t" \
                --backend Model --platform "$PLATFORM"
            rc=$?
            took=$(( $(date +%s) - start ))
            # exit 2 means the check could not be carried out here (OOM,
            # timeout, signal), which is `blocked`, not `failed`. The two are
            # different results and the gate keeps them apart: a kernel that
            # does not compile is a defect, a runner that cannot hold a 7.4 GiB
            # input tensor says nothing about the kernel.
            case "$rc" in
              0) echo "[PASS] $rel (${took}s)" ;;
              2) echo "[BLOCKED] $rel (${took}s)"; BLOCKED=$((BLOCKED + 1)) ;;
              *) echo "[FAIL] $rel (${took}s)"; FAILED=$((FAILED + 1)) ;;
            esac
            ran=$((ran + 1))
          done < <(find reference/asctile/target -name 'test_*.py' -type f | sort)
          echo "compile-checked $ran module(s); $FAILED failed; $BLOCKED blocked"
          if [ "$ran" -eq 0 ]; then
            echo "ERROR: no target modules found under reference/asctile/target/"
            exit 1
          fi
          if [ "$BLOCKED" -gt 0 ]; then
            echo "NOTE: $BLOCKED module(s) blocked on runner resources, not"
            echo "      compile errors. Tracked in docs/verification-status.md."
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED target module(s) failed the compile check"
            exit 1
          fi
