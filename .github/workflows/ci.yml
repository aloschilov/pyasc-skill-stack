name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  # Version-coupled to an immutable pyasc commit. Never point CI at a mutable
  # tag: a moving runtime silently invalidates every result below it.
  PYASC_SIM_IMAGE: ghcr.io/${{ github.repository_owner }}/pyasc-sim:py3.11-pyasc-030e9b2c
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ==========================================================================
  # PR gate: L1 unit tests + static checks (no Docker, no CANN)
  # ==========================================================================
  pr-gate:
    # Native arm64 on the self-hosted Mac runner (label `arm64`). This gate is
    # pure static checks + L1 unit tests (no Docker, no CANN); CI now runs
    # entirely on the Mac runner with no x86 emulation. (Formerly GitHub-hosted
    # ubuntu-latest; before that the RTX 4090 `gpu` box, now retired.)
    runs-on: [self-hosted, arm64]
    # Explicit cap; overrides GitHub's implicit 6h (timeout-minutes: 360) default.
    # Static checks + L1 units are fast; this is pure hygiene.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run PR gate
        run: bash tests/ci-gate.sh --tier pr


  # ==========================================================================
  # Merge gate: compile-check the upstream AscTile target suite in Docker
  #
  # This is the correctness reference (see reference/README.md). Compile-only:
  # each module carries ~100 parametrised cases and the camodel is slow, so the
  # blocking gate verifies COMPILE and leaves full numerical execution to a
  # manual or nightly run.
  #
  # The Docker image is pre-built locally (it contains a native C++ extension)
  # and pushed to ghcr.io. CI only pulls it.
  # ==========================================================================
  merge-gate:
    runs-on: [self-hosted, arm64]
    timeout-minutes: 60
    needs: [pr-gate]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pyasc-sim image
        run: |
          docker pull "${{ env.PYASC_SIM_IMAGE }}"
          tests/tools/verify_pyasc_image.sh "${{ env.PYASC_SIM_IMAGE }}"

      - name: Compile-check the AscTile target suite
        run: |
          set -uo pipefail
          PLATFORM=Ascend950PR_9599
          IMAGE="${{ env.PYASC_SIM_IMAGE }}"
          FAILED=0; ran=0
          # Container-leak guard: --rm only fires on a clean exit, which a hung
          # simulator never gives, so the trap is the actual guarantee.
          CTR_NAME="pyasc-target-${{ github.run_id }}"
          trap 'docker rm -f "$CTR_NAME" 2>/dev/null || true' EXIT INT TERM
          for t in reference/asctile/target/test_*.py; do
            [ -f "$t" ] || continue
            base="$(basename "$t")"
            # test_add_inplace: 4 large-shape cases exceed the 192KB UB budget
            # even under --compile-only; the other 16 pass. Pending a shape trim
            # or a PYASC_TESTS_BEGIN representative-case block.
            case "$base" in
              test_add_inplace.py) echo "[SKIP] $base (4 UB-overflow cases on large shapes; pending trim)"; continue ;;
            esac
            start=$(date +%s)
            if docker run --rm --name "${CTR_NAME}-${base%.py}" \
              --ulimit nofile=65536:65536 \
              -v "$PWD":/workspace:ro -w /workspace "$IMAGE" \
              python3.11 tests/tools/run_target_test.py "$t" \
                --backend Model --platform "$PLATFORM"; then
              echo "[PASS] $base ($(( $(date +%s) - start ))s)"
            else
              echo "[FAIL] $base ($(( $(date +%s) - start ))s)"
              FAILED=$((FAILED + 1))
            fi
            ran=$((ran + 1))
          done
          echo "compile-checked $ran module(s); $FAILED failed"
          if [ "$ran" -eq 0 ]; then
            echo "ERROR: no target modules found under reference/asctile/target/"
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED target module(s) failed the compile check"
            exit 1
          fi
