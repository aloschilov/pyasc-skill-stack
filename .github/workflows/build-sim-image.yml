name: Build pyasc-sim image

# Manual-only build of a single-arch pyasc-sim leg (amd64 on a GitHub-hosted
# runner — the RTX 4090 amd64 box is retired + QEMU emulation of the
# CANN+pyasc+LLVM toolchain is impractical) + optional multiarch manifest
# merge. After both the arm64 leg (built on the Mac) + the amd64 leg (this)
# are pushed, set merge=true to publish the version-coupled manifest.
#
# The pinned pyasc source is carried as a verified Git bundle in docker/, so
# hosted builds do not depend on GitCode credentials or availability.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "arch to build (amd64 | arm64)"
        type: choice
        options: [amd64, arm64]
        default: amd64
      pyasc_rev:
        description: "pyasc git rev (must match bundled source; current skills pin 030e9b2c)"
        type: string
        default: 030e9b2c0ce44cbc5f9523e03e131f4a23c23a2d
      setup_jobs:
        description: "native extension build parallelism (use 1 on memory-constrained runners)"
        type: string
        default: "2"
      merge:
        description: "after push, also merge the multiarch manifest (needs both legs pushed)"
        type: boolean
        default: false
      merge_only:
        description: "publish the multiarch manifest without rebuilding a leg"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build + push pyasc-sim (${{ inputs.arch }}, ${{ inputs.pyasc_rev }})
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add swap for the native pyasc link
        if: ${{ !inputs.merge_only }}
        run: |
          pyasc_swap_path=/mnt/pyasc-swapfile
          sudo fallocate -l 8G "$pyasc_swap_path"
          sudo chmod 600 "$pyasc_swap_path"
          sudo mkswap "$pyasc_swap_path"
          sudo swapon "$pyasc_swap_path"
          free -h

      - name: Build + push ${{ inputs.arch }} leg
        if: ${{ !inputs.merge_only }}
        env:
          OWNER: ${{ github.repository_owner }}
          PYASC_GIT_REV: ${{ inputs.pyasc_rev }}
          PYASC_SETUP_JOBS: ${{ inputs.setup_jobs }}
        run: |
          bash docker/build-sim-image.sh --arch ${{ inputs.arch }} --push &
          build_pid=$!
          trap 'kill "$build_pid" 2>/dev/null || true' EXIT
          while kill -0 "$build_pid" 2>/dev/null; do
            sleep 45
            if kill -0 "$build_pid" 2>/dev/null; then
              echo "pyasc image build still active ($(date -u +%FT%TZ))"
              free -h | sed -n '1,2p'
            fi
          done
          wait "$build_pid"
          trap - EXIT

      - name: Merge multiarch manifest
        if: ${{ inputs.merge || inputs.merge_only }}
        env:
          OWNER: ${{ github.repository_owner }}
          PYASC_GIT_REV: ${{ inputs.pyasc_rev }}
        run: bash docker/build-sim-image.sh --merge
