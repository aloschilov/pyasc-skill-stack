name: Opt-in generation

# Daily simulator generation; PRs only plan, without provider credentials.
on:
  schedule:
    - cron: '17 17 * * *'
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Plan only by default; execute compares with the configured baseline'
        type: choice
        options: [plan, execute]
        default: plan
      approve_plan:
        description: 'Exact reviewed digest required for manual execution'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

# Offline planning must not evict another PR or a pending paid execution.
concurrency:
  group: ${{ (github.event_name == 'pull_request' || inputs.mode == 'plan') && format('generation-nightly-plan-{0}', github.run_id) || 'generation-nightly' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'aloschilov/pyasc-skill-stack'
    runs-on: [self-hosted, arm64]
    timeout-minutes: 10
    outputs:
      action: ${{ steps.decision.outputs.action }}
      approve_plan: ${{ steps.decision.outputs.approve_plan }}
      baseline_ref: ${{ steps.decision.outputs.baseline_ref }}
      baseline_sha256: ${{ steps.decision.outputs.baseline_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Select external control evidence
        run: echo "CONTROL_ROOT=$(dirname "$RUNNER_WORKSPACE")/.pyasc-generation/control/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Validate policy and prepare plan (no provider credentials)
        id: decision
        env:
          MODE: ${{ inputs.mode || 'plan' }}
          APPROVAL: ${{ inputs.approve_plan }}
        run: python3 scripts/generation_operations.py plan --root "$CONTROL_ROOT" --mode "$MODE" --approve-plan "$APPROVAL"
      - name: Provision the pinned simulator
        if: steps.decision.outputs.action == 'execute'
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          image = json.loads(Path('reference/images/ENV.json').read_text())['dev_image']['ref']
          subprocess.run(['docker', 'pull', image], check=True, timeout=480)
          PY
      - name: Preserve control decision including failures
        if: always() && env.CONTROL_ROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: generation-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CONTROL_ROOT }}/
          if-no-files-found: error
          retention-days: 90

  qualify:
    needs: prepare
    if: github.event_name != 'pull_request' && needs.prepare.outputs.action != 'none'
    uses: ./.github/workflows/generation-simulator.yml
    with:
      action: ${{ needs.prepare.outputs.action }}
      approve_plan: ${{ needs.prepare.outputs.approve_plan }}
      baseline_ref: ${{ needs.prepare.outputs.baseline_ref }}
      baseline_sha256: ${{ needs.prepare.outputs.baseline_sha256 }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
